
{
  "openapi": "3.0.3",
  "info": {
    "title": "Open-Meteo City Forecast",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "https://geocoding-api.open-meteo.com"
    }
  ],
  "paths": {
    "/v1/search": {
      "get": {
        "operationId": "searchCity",
        "summary": "Find city coordinates",
        "parameters": [
          {
            "name": "name",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "City name"
          },
          {
            "name": "count",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "default": 1
            }
          }
        ],
        "responses": {
          "200": {
            "description": "City coordinates",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "results": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "name": {
                            "type": "string"
                          },
                          "latitude": {
                            "type": "number"
                          },
                          "longitude": {
                            "type": "number"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/forecast": {
      "get": {
        "servers": [
          {
            "url": "https://api.open-meteo.com"
          }
        ],
        "operationId": "getWeatherForecast",
        "summary": "Get weather forecast",
        "parameters": [
          {
            "name": "latitude",
            "in": "query",
            "required": true,
            "schema": {
              "type": "number"
            }
          },
          {
            "name": "longitude",
            "in": "query",
            "required": true,
            "schema": {
              "type": "number"
            }
          },
          {
            "name": "daily",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "default": "temperature_2m_max,temperature_2m_min,weather_code"
            }
          },
          {
            "name": "forecast_days",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "default": 7
            }
          },
          {
            "name": "timezone",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "default": "auto"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Weather forecast",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          }
        }
      }
    }
  }
}
