
openapi: "3.0.3"
info:
  title: Open-Meteo Weather API
  description: Search for a city and retrieve current weather and daily forecasts.
  version: "1.0.0"

servers:
  - url: https://geocoding-api.open-meteo.com
    description: Open-Meteo Geocoding API

paths:
  /v1/search:
    get:
      operationId: searchCity
      summary: Search for a city
      description: Find a city's latitude and longitude using its name.
      parameters:
        - name: name
          in: query
          required: true
          description: City name, for example Hyderabad.
          schema:
            type: string
        - name: count
          in: query
          required: false
          description: Maximum number of matching locations.
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 10
        - name: language
          in: query
          required: false
          schema:
            type: string
            default: en
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
            default: json
      responses:
        "200":
          description: Matching cities
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        latitude:
                          type: number
                          format: double
                        longitude:
                          type: number
                          format: double
                        country:
                          type: string
                        admin1:
                          type: string
                        timezone:
                          type: string
        "400":
          description: Invalid city search request

  /v1/forecast:
    get:
      servers:
        - url: https://api.open-meteo.com
          description: Open-Meteo Forecast API
      operationId: getWeatherForecast
      summary: Get current weather and forecast
      description: >
        Retrieve current weather conditions and daily forecasts using
        latitude and longitude returned by searchCity.
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude of the selected city.
          schema:
            type: number
            format: double
        - name: longitude
          in: query
          required: true
          description: Longitude of the selected city.
          schema:
            type: number
            format: double
        - name: current
          in: query
          required: false
          description: Current weather variables.
          schema:
            type: string
            default: temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m
        - name: daily
          in: query
          required: false
          description: Daily forecast variables.
          schema:
            type: string
            default: temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code
        - name: forecast_days
          in: query
          required: false
          description: Number of forecast days.
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 7
        - name: timezone
          in: query
          required: false
          description: Automatically detect the location timezone.
          schema:
            type: string
            default: auto
      responses:
        "200":
          description: Current conditions and daily forecast
          content:
            application/json:
              schema:
                type: object
                properties:
                  latitude:
                    type: number
                  longitude:
                    type: number
                  timezone:
                    type: string
                  current:
                    type: object
                    properties:
                      time:
                        type: string
                      interval:
                        type: integer
                      temperature_2m:
                        type: number
                      relative_humidity_2m:
                        type: integer
                      apparent_temperature:
                        type: number
                      is_day:
                        type: integer
                      precipitation:
                        type: number
                      weather_code:
                        type: integer
                      wind_speed_10m:
                        type: number
                  current_units:
                    type: object
                    additionalProperties:
                      type: string
                  daily:
                    type: object
                    properties:
                      time:
                        type: array
                        items:
                          type: string
                          format: date
                      temperature_2m_max:
                        type: array
                        items:
                          type: number
                          nullable: true
                      temperature_2m_min:
                        type: array
                        items:
                          type: number
                          nullable: true
                      precipitation_probability_max:
                        type: array
                        items:
                          type: integer
                          nullable: true
                      weather_code:
                        type: array
                        items:
                          type: integer
                          nullable: true
                  daily_units:
                    type: object
                    additionalProperties:
                      type: string
        "400":
          description: Invalid coordinates or forecast parameters
